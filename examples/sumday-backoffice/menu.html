<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMDAY · เมนู &amp; ราคา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .search{position:relative;width:260px;}
  @media(max-width:760px){.search{width:auto;flex:1 1 200px;}}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;}
  .search .input{padding:10px 14px 10px 38px;border-radius:var(--r-pill);}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
  .mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);
    display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;}
  .mcard:hover{transform:translateY(-3px);box-shadow:var(--sh);}
  .mcard.off{opacity:.7;}
  .mcard .thumb{position:relative;aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;}
  .mcard .thumb img{width:80%;height:88%;object-fit:contain;mix-blend-mode:multiply;transition:transform .25s;}
  .mcard .thumb .ph{font-size:64px;}
  .mcard:hover .thumb img{transform:scale(1.06);}
  .mcard.off .thumb img{filter:grayscale(.75);}
  .mcard .tags{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;}
  .mcard .tag{font-family:var(--display);font-weight:600;font-size:11px;padding:3px 10px;border-radius:var(--r-pill);color:#fff;}
  .mcard .tag.hot{background:var(--accent);} .mcard .tag.new{background:var(--primary);} .mcard .tag.rec{background:var(--gold);color:#5a3d12;}
  .mcard .soldout{position:absolute;inset:0;display:none;place-items:center;background:rgba(62,49,39,.28);}
  .mcard.off .soldout{display:grid;}
  .mcard .soldout span{background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:6px 16px;border-radius:var(--r-pill);transform:rotate(-6deg);}
  .mcard .body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:3px;flex:1;}
  .mcard .body h3{font-size:16px;font-weight:600;line-height:1.2;}
  .mcard .body .th{font-size:13px;color:var(--muted);}
  .mcard .body .price{margin-top:auto;padding-top:6px;font-family:var(--display);font-weight:700;font-size:19px;color:var(--primary);}
  .mcard .foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);}
  .avail{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .mcard.off .avail{color:var(--danger-ink);}
  .mcard .edit{font-size:13px;font-weight:600;color:var(--primary);padding:5px 10px;border-radius:8px;}
  .mcard .edit:hover{background:var(--primary-soft);}
  .cat-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .sync-note{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .sync-note i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #D3EEDF;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:460px){.row2{grid-template-columns:1fr;}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);border:1.5px solid var(--border-2);background:var(--surface);color:var(--ink-soft);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--border);}
  .switch .t b{font-size:14px;font-weight:600;} .switch .t span{display:block;font-size:12px;color:var(--muted);}
  .prev{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;margin-bottom:14px;}
  .prev .pic{width:64px;height:64px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:30px;overflow:hidden;flex:0 0 auto;}
  .prev .pic img{width:84%;height:84%;object-fit:contain;mix-blend-mode:multiply;}
  .prev small{display:block;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="tb-title">
        <h1>เมนู &amp; ราคา</h1>
        <div class="sub">เปิด–ปิดการขาย แก้ราคา และเพิ่มเมนูบนหน้าร้าน</div>
      </div>
      <div class="spacer"></div>
      <div class="bar-actions">
        <div class="search"><span class="ic">🔍</span><input class="input" id="search" placeholder="ค้นหาเมนู…"></div>
        <button class="btn btn-primary btn-sm" id="addBtn">＋ เพิ่มเมนู</button>
      </div>
    </div>

    <div class="content">
      <div id="closedBanner"></div>
      <div class="stats" id="stats"></div>
      <div class="cat-row">
        <div class="filters" id="cats" style="margin:0"></div>
        <span class="sync-note"><i></i>เปลี่ยนแล้วมีผลกับหน้าร้านทันที</span>
      </div>
      <div class="menu-grid" id="grid"></div>
      <div id="emptyState"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="store.js"></script>
<script src="shell.js"></script>
<script>
const S=SUMDAY, {$,esc,mini}=Shell;
const IMG='../../img/menu/';
const CATS=[{k:'all',n:'ทั้งหมด'},...S.CATS];
Shell.init('menu');

let activeCat='all', q='', editing=null; // editing = draft object ของเมนูที่เปิดแก้อยู่

const pic=m=>m.img?`<img src="${IMG}${m.img}" alt="${esc(m.th)}" loading="lazy">`:`<span class="ph">☕</span>`;

function renderStats(menu){
  const total=menu.length, on=menu.filter(m=>m.on).length, prices=menu.map(m=>m.price);
  $('#stats').innerHTML=`
    <div class="stat"><div class="ic" style="background:var(--primary-soft);color:var(--primary)">🍽️</div>
      <div class="lbl">เมนูทั้งหมด</div><div class="val">${total}</div><div class="trend">${S.CATS.length} หมวด</div></div>
    <div class="stat"><div class="ic" style="background:var(--ready-soft);color:var(--ready-ink)">✅</div>
      <div class="lbl">พร้อมขาย</div><div class="val">${on}</div><div class="trend">ลูกค้าเห็นและกดสั่งได้</div></div>
    <div class="stat"><div class="ic" style="background:var(--danger-soft);color:var(--danger-ink)">⛔</div>
      <div class="lbl">ของหมด</div><div class="val">${total-on}</div><div class="trend">หน้าร้านขึ้นป้าย “หมด”</div></div>
    <div class="stat"><div class="ic" style="background:var(--accent-soft);color:var(--accent-strong)">฿</div>
      <div class="lbl">ราคาเฉลี่ย</div><div class="val">฿${total?Math.round(prices.reduce((s,p)=>s+p,0)/total):0}</div><div class="trend">${total?`฿${Math.min(...prices)}–${Math.max(...prices)}`:'—'}</div></div>`;
}
function renderCats(menu){
  $('#cats').innerHTML=CATS.map(c=>{
    const n=c.k==='all'?menu.length:menu.filter(m=>m.cat===c.k).length;
    return `<button class="tab ${activeCat===c.k?'active':''}" data-c="${c.k}">${c.n} <span class="ct">${n}</span></button>`;
  }).join('');
}
function card(m){
  const tags=[m.tag==='hot'?'<span class="tag hot">ขายดี</span>':'',m.tag==='new'?'<span class="tag new">ใหม่</span>':'',m.rec?'<span class="tag rec">⭐ แนะนำ</span>':''].join('');
  return `<div class="mcard ${m.on?'':'off'}">
    <div class="thumb"><div class="tags">${tags}</div>${pic(m)}<div class="soldout"><span>ของหมด</span></div></div>
    <div class="body"><h3>${esc(m.en)}</h3><span class="th">${esc(m.th)}</span><span class="price">฿${m.price}</span></div>
    <div class="foot">
      <span class="avail" data-toggle="${m.id}"><span class="toggle ${m.on?'on':''}"></span>${m.on?'พร้อมขาย':'ของหมด'}</span>
      <button class="edit" data-edit="${m.id}">แก้ไข</button>
    </div></div>`;
}
function renderGrid(menu){
  let list=menu.filter(m=>activeCat==='all'||m.cat===activeCat);
  if(q)list=list.filter(m=>(m.th+' '+m.en).toLowerCase().includes(q));
  $('#grid').innerHTML=list.map(card).join('');
  $('#emptyState').innerHTML=list.length?'':`<div class="empty"><div class="e-ic">🔍</div><b>ไม่พบเมนูที่ค้นหา</b>ลองค้นด้วยคำอื่น</div>`;
}
function renderAll(){const menu=S.getMenu();renderStats(menu);renderCats(menu);renderGrid(menu);}

/* ---------- edit / add modal ---------- */
function openEditor(id){
  const m=id==null?null:S.getMenu().find(x=>x.id===id);
  editing=m?{...m}:{id:null,en:'',th:'',price:60,cat:activeCat==='all'?'coffee':activeCat,img:null,tag:'',rec:false,on:true};
  renderEditor(); $('#overlay').classList.add('show'); document.body.style.overflow='hidden';
  setTimeout(()=>$('#fEn')?.focus(),50);
}
function renderEditor(){
  const m=editing, isNew=m.id==null, base=!isNew&&S.BASE_MENU.some(b=>b.id===m.id);
  $('#modal').innerHTML=`
    <div class="mh"><h3>${isNew?'เพิ่มเมนูใหม่':'แก้ไขเมนู'}</h3><button class="x" data-act="close" aria-label="ปิด">✕</button></div>
    <div class="mb">
      <div class="prev"><span class="pic">${m.img?`<img src="${IMG}${m.img}" alt="">`:'☕'}</span>
        <div><b>${esc(m.en)||'ชื่อเมนู'}</b><small>${esc(m.th)||'ชื่อภาษาไทย'} · ฿${m.price||0}</small>
        ${m.img?'':'<small>ไม่มีรูป — หน้าร้านจะแสดงไอคอน ☕ แทน</small>'}</div></div>
      <div class="row2">
        <div class="field"><label>ชื่อเมนู (EN) *</label><input class="input" id="fEn" value="${esc(m.en)}" placeholder="เช่น Mocha"><div class="err" id="eEn">กรุณากรอกชื่อเมนู</div></div>
        <div class="field"><label>ชื่อภาษาไทย *</label><input class="input" id="fTh" value="${esc(m.th)}" placeholder="เช่น มอคค่า"><div class="err" id="eTh">กรุณากรอกชื่อภาษาไทย</div></div>
      </div>
      <div class="field"><label>ราคา (บาท) *</label><input class="input" id="fPrice" type="number" min="1" max="999" inputmode="numeric" value="${m.price}"><div class="err" id="ePrice">ราคาต้องอยู่ระหว่าง 1–999 บาท</div></div>
      <div class="field"><label>หมวด</label><div class="chips" id="fCat">${S.CATS.map(c=>`<button type="button" class="chip ${m.cat===c.k?'on':''}" data-cat="${c.k}">${c.n}</button>`).join('')}</div></div>
      <div class="field"><label>ป้ายบนการ์ด</label><div class="chips" id="fTag">${[['','ไม่มี'],['hot','ขายดี'],['new','ใหม่']].map(([k,l])=>`<button type="button" class="chip ${(m.tag||'')===k?'on':''}" data-tag="${k}">${l}</button>`).join('')}</div></div>
      <div class="switch"><div class="t"><b>⭐ เมนูแนะนำ</b><span>แสดงในแท็บ “แนะนำ” ของหน้าร้าน</span></div><span class="toggle ${m.rec?'on':''}" data-flag="rec"></span></div>
      <div class="switch"><div class="t"><b>พร้อมขาย</b><span>ปิด = หน้าร้านขึ้นป้าย “หมด” และกดสั่งไม่ได้</span></div><span class="toggle ${m.on?'on':''}" data-flag="on"></span></div>
    </div>
    <div class="mf">
      ${!isNew&&!base?'<button class="btn btn-danger" data-act="delete">ลบเมนู</button>':''}
      <button class="btn btn-ghost" data-act="close">ยกเลิก</button>
      <button class="btn btn-primary" style="flex:1" data-act="save">${isNew?'＋ เพิ่มเมนู':'บันทึก'}</button>
    </div>`;
}
function readForm(){editing.en=$('#fEn').value.trim();editing.th=$('#fTh').value.trim();editing.price=Math.round(+$('#fPrice').value);}
function saveEditor(){
  readForm(); const m=editing;
  const bad={eEn:!m.en,eTh:!m.th,ePrice:!(m.price>=1&&m.price<=999)};
  Object.entries(bad).forEach(([id,b])=>$('#'+id).classList.toggle('show',b));
  if(Object.values(bad).some(Boolean))return;
  const menu=S.getMenu();
  if(m.id==null){m.id=Math.max(1000,...menu.map(x=>x.id))+1;menu.push(m);mini(`เพิ่ม ${m.en} แล้ว · ขึ้นหน้าร้านทันที ✓`);}
  else{const i=menu.findIndex(x=>x.id===m.id);menu[i]=m;mini(`บันทึก ${m.en} แล้ว ✓`);}
  S.saveMenu(menu); closeEditor(); renderAll();
}
function deleteItem(){
  if(!confirm(`ลบเมนู "${editing.en}" ออกจากหน้าร้าน?`))return;
  S.saveMenu(S.getMenu().filter(x=>x.id!==editing.id)); mini(`ลบ ${editing.en} แล้ว`); closeEditor(); renderAll();
}
function closeEditor(){editing=null;$('#overlay').classList.remove('show');document.body.style.overflow='';}

$('#modal').addEventListener('click',e=>{
  const c=e.target.closest('[data-cat]'); if(c){readForm();editing.cat=c.dataset.cat;renderEditor();return;}
  const t=e.target.closest('[data-tag]'); if(t){readForm();editing.tag=t.dataset.tag||undefined;renderEditor();return;}
  const f=e.target.closest('[data-flag]'); if(f){readForm();editing[f.dataset.flag]=!editing[f.dataset.flag];renderEditor();return;}
  const a=e.target.closest('[data-act]'); if(a)({close:closeEditor,save:saveEditor,delete:deleteItem})[a.dataset.act]();
});
$('#modal').addEventListener('input',e=>{if(['fEn','fTh','fPrice'].includes(e.target.id)){readForm();
  const p=$('#modal .prev div');p.querySelector('b').textContent=editing.en||'ชื่อเมนู';p.querySelector('small').textContent=`${editing.th||'ชื่อภาษาไทย'} · ฿${editing.price||0}`;}});
$('#modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')saveEditor();});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeEditor();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editing)closeEditor();});

/* ---------- grid events ---------- */
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;activeCat=b.dataset.c;renderAll();});
$('#grid').addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){const menu=S.getMenu(),m=menu.find(x=>x.id==tg.dataset.toggle);m.on=!m.on;S.saveMenu(menu);renderAll();
    mini(`${m.th} · ${m.on?'เปิดขายแล้ว ✓':'ตั้งเป็นของหมด — หน้าร้านกดสั่งไม่ได้'}`);return;}
  const ed=e.target.closest('[data-edit]'); if(ed)openEditor(+ed.dataset.edit);
});
$('#search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderGrid(S.getMenu());});
$('#addBtn').addEventListener('click',()=>openEditor(null));

Shell.onChange(k=>{if(k==='menu')renderAll();});
renderAll();
</script>
</body>
</html>
