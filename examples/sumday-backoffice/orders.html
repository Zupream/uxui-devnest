<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMDAY · ออเดอร์เข้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .tool-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .tool-row .filters{margin:0;}
  .search{position:relative;width:100%;max-width:280px;}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;}
  .search .input{padding:10px 14px 10px 36px;border-radius:var(--r-pill);font-size:14px;}
  .hint{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px dashed var(--border-2);border-radius:10px;padding:8px 11px;margin-top:12px;}
  .reason{font-size:12.5px;color:var(--danger-ink);background:var(--danger-soft);border-radius:10px;padding:8px 11px;margin-top:12px;}
  .wait{font-weight:600;color:var(--accent-strong);}

  /* slip */
  .slip-box{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;background:var(--verify-soft);border:1px solid #F3DDA4;border-radius:var(--r-lg);padding:14px;}
  @media(max-width:460px){.slip-box{grid-template-columns:1fr;}}
  .slip-box .pic{border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--border);cursor:zoom-in;aspect-ratio:9/14;display:grid;place-items:center;}
  .slip-box .pic img{width:100%;height:100%;object-fit:contain;}
  .slip-box .pic.none{cursor:default;color:var(--muted);font-size:12.5px;text-align:center;padding:10px;}
  .slip-box h4{font-size:14px;margin-bottom:6px;}
  .slip-box .chk{list-style:none;font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;}
  .slip-box .amt{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ink);margin:4px 0 10px;}
  .reject-box{margin-top:14px;padding:14px;border:1.5px solid var(--danger);border-radius:var(--r-lg);background:var(--danger-soft);}
  .reject-box .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
  .reject-box .opts button{font-size:13px;font-weight:600;padding:7px 13px;border-radius:var(--r-pill);background:#fff;border:1.5px solid #F2C3BC;color:var(--danger-ink);}
  .reject-box .opts button.on{background:var(--danger);border-color:var(--danger);color:#fff;}

  .lightbox{position:fixed;inset:0;background:rgba(30,22,16,.86);z-index:120;display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;cursor:zoom-out;}
  .lightbox.show{opacity:1;pointer-events:auto;}
  .lightbox img{max-width:min(92vw,520px);max-height:90vh;border-radius:14px;background:#fff;}

  .notif-pop{position:absolute;top:52px;right:0;width:320px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:var(--sh-lg);overflow:hidden;z-index:40;opacity:0;pointer-events:none;transform:translateY(-6px);transition:all .18s;}
  .notif-pop.show{opacity:1;pointer-events:auto;transform:none;}
  .notif-pop .nh{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;}
  .notif-list{max-height:330px;overflow:auto;}
  .notif-list .ni{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer;width:100%;text-align:left;}
  .notif-list .ni:hover{background:var(--surface-2);}
  .notif-list .ni .ic{width:34px;height:34px;border-radius:9px;background:var(--verify-soft);color:var(--verify-ink);display:grid;place-items:center;flex:0 0 auto;}
  .notif-list .ni b{font-weight:600;} .notif-list .ni span{color:var(--muted);font-size:12px;}
  .notif-list .empty-n{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;}
  @media(max-width:560px){.store-toggle .lbl-txt{display:none;}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="tb-title">
        <h1>ออเดอร์เข้า</h1>
        <div class="sub" id="clock">วันนี้ · อัปเดตเรียลไทม์</div>
      </div>
      <div class="spacer"></div>
      <div class="bar-actions">
        <button class="btn btn-accent btn-sm" id="simBtn" title="จำลองว่ามีลูกค้าสั่งจากหน้าร้าน">🔔 จำลองออเดอร์ใหม่</button>
        <span class="store-toggle" id="storeToggleWrap"><span class="toggle" id="storeToggle"></span><span class="lbl-txt" id="storeLbl">เปิดรับออเดอร์</span></span>
        <div style="position:relative">
          <button class="bell" id="bell" aria-label="ออเดอร์รอตรวจสลิป">🔔<span class="dot" id="bellDot"></span></button>
          <div class="notif-pop" id="notifPop">
            <div class="nh">รอตรวจสลิป</div>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="closedBanner"></div>
      <div class="stats" id="stats"></div>
      <div class="tool-row">
        <div class="filters" id="filters"></div>
        <div class="search"><span class="ic">🔍</span><input class="input" id="search" placeholder="ค้นหาเลขออเดอร์ / ชื่อ / เบอร์"></div>
      </div>
      <div class="orders" id="orders"></div>
      <div id="emptyState"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt="สลิปการโอน"></div>

<script src="store.js"></script>
<script src="shell.js"></script>
<script>
const S=SUMDAY, {$,esc,baht,ago,clock,mini}=Shell;
const IMG='../../img/menu/';
Shell.init('orders');

/* ============================================================
   FLOW — ตามรูปแบบที่ลูกค้าเลือกตอนสั่งในหน้าร้าน
   pickup   : ตรวจสลิป → กำลังทำ → พร้อมรับ → ลูกค้ามารับที่เคาน์เตอร์
   callback : ตรวจสลิป → กำลังทำ → พร้อมรับ → โทรแจ้งลูกค้า → ลูกค้ามารับ
   ============================================================ */
const STEPS={
  verify:{t:'ตรวจสลิปการโอน',s:'ลูกค้าชำระผ่าน PromptPay + แนบสลิป'},
  doing: {t:'กำลังทำ',s:'ยืนยันยอดแล้ว · บาริสต้ารับงาน'},
  ready: {t:'ทำเสร็จแล้ว',s:'วางที่เคาน์เตอร์รับเครื่องดื่ม'},
  coming:{t:'โทรแจ้งลูกค้าแล้ว',s:'รอลูกค้ามารับ'},
  picked:{t:'ลูกค้ารับแล้ว',s:'ตรวจเลขออเดอร์ในใบเสร็จ · ปิดออเดอร์'},
};
const flowOf=o=>o.type==='callback'?['verify','doing','ready','coming','picked']:['verify','doing','ready','picked'];
const GROUPS={active:['verify','doing','ready','coming'],verify:['verify'],doing:['doing'],ready:['ready','coming'],done:['picked','cancel']};
const REASONS=['ยอดโอนไม่ตรงกับยอดสั่งซื้อ','ไม่พบยอดเงินเข้าบัญชี','สลิปไม่ชัด / ไม่ใช่สลิปจริง','สลิปซ้ำกับออเดอร์อื่น'];

let filter='active', q='', openNo=null, rejecting=false, rejectReason=REASONS[0];

const isToday=at=>new Date(at).toDateString()===new Date().toDateString();
const itemName=i=>i.custom?esc(i.en):esc(i.th||i.en);
const thumb=i=>i.img?`<img src="${IMG}${i.img}" alt="" loading="lazy">`:'☕';
const callHref=o=>'tel:'+o.phone.replace(/\D/g,'');

/* ---------- stats ---------- */
function renderStats(orders){
  const c=k=>orders.filter(o=>o.status===k).length;
  const today=orders.filter(o=>isToday(o.createdAt)&&!['verify','cancel'].includes(o.status));
  $('#stats').innerHTML=`
    <div class="stat"><div class="ic" style="background:var(--verify-soft);color:var(--verify-ink)">🧾</div>
      <div class="lbl">รอตรวจสลิป</div><div class="val">${c('verify')}</div><div class="trend">เช็กยอดก่อนเริ่มทำ</div></div>
    <div class="stat"><div class="ic" style="background:var(--doing-soft);color:var(--doing-ink)">👩‍🍳</div>
      <div class="lbl">กำลังทำ</div><div class="val">${c('doing')}</div><div class="trend">${c('doing')?'คิวเก่าสุดอยู่บนสุด':'ไม่มีคิวค้าง'}</div></div>
    <div class="stat"><div class="ic" style="background:var(--ready-soft);color:var(--ready-ink)">✅</div>
      <div class="lbl">พร้อมรับ</div><div class="val">${c('ready')+c('coming')}</div><div class="trend">${orders.filter(o=>o.status==='ready'&&o.type==='callback').length} ออเดอร์ต้องโทรแจ้ง</div></div>
    <div class="stat"><div class="ic" style="background:var(--accent-soft);color:var(--accent-strong)">฿</div>
      <div class="lbl">ยอดขายวันนี้</div><div class="val">${today.reduce((s,o)=>s+S.orderTotal(o),0).toLocaleString()}</div><div class="trend">${today.length} บิล · ยืนยันยอดแล้ว</div></div>`;
}

/* ---------- filters ---------- */
function renderFilters(orders){
  const defs=[['active','ต้องทำ'],['verify','รอตรวจสลิป'],['doing','กำลังทำ'],['ready','พร้อมรับ'],['done','ปิดแล้ว']];
  $('#filters').innerHTML=defs.map(([k,l])=>{
    const n=orders.filter(o=>GROUPS[k].includes(o.status)).length;
    return `<button class="tab ${filter===k?'active':''}" data-f="${k}">${l} <span class="ct">${n}</span></button>`;
  }).join('');
}

/* ---------- order card ---------- */
function primaryAction(o,big){
  const cls=big?'':' btn-sm';
  switch(o.status){
    case 'verify':return `<button class="btn btn-primary${cls}" data-open="${o.no}">🧾 ตรวจสลิป</button>`;
    case 'doing': return `<button class="btn btn-primary${cls}" data-go="${o.no}" data-to="ready">ทำเสร็จแล้ว →</button>`;
    case 'ready': return o.type==='callback'
      ? `<a class="btn btn-coming${cls}" href="${callHref(o)}">📞 โทร</a><button class="btn btn-primary${cls}" data-go="${o.no}" data-to="coming">โทรแจ้งแล้ว →</button>`
      : `<button class="btn btn-green${cls}" data-go="${o.no}" data-to="picked">ลูกค้ารับแล้ว ✓</button>`;
    case 'coming':return `<button class="btn btn-green${cls}" data-go="${o.no}" data-to="picked">ลูกค้ารับแล้ว ✓</button>`;
    case 'cancel':return `<a class="btn btn-ghost${cls}" href="${callHref(o)}">📞 โทรแจ้งลูกค้า</a>`;
  }
  return '';
}
function statusHint(o){
  if(o.status==='ready'&&o.type==='pickup')return `<div class="hint">🏃 ลูกค้าจะมารับเอง — ขอดูใบเสร็จเลข <b>${esc(o.no)}</b> ก่อนส่งเครื่องดื่ม</div>`;
  if(o.status==='ready'&&o.type==='callback')return `<div class="hint">📞 ลูกค้าขอให้โทรแจ้งเมื่อพร้อม — โทร <b class="mono">${esc(o.phone)}</b></div>`;
  if(o.status==='coming')return `<div class="hint">⏳ แจ้งลูกค้าแล้ว ${ago(lastAt(o,'coming'))} — รอมารับที่เคาน์เตอร์</div>`;
  if(o.status==='cancel')return `<div class="reason">❌ ${esc(o.reason||'ยกเลิกออเดอร์')}</div>`;
  return '';
}
const lastAt=(o,s)=>{const h=(o.history||[]).filter(x=>x.s===s).pop();return h?h.at:o.createdAt;};
function orderCard(o){
  const items=o.items.slice(0,3).map(i=>`<li><span class="th">${thumb(i)}</span><span class="q">${i.qty}×</span>
      <span class="nm">${itemName(i)}<small>${i.custom?'เมนูพิเศษ · ':''}หวาน ${esc(i.sweet)}</small></span><span class="pr">${i.price*i.qty}</span></li>`).join('');
  const more=o.items.length>3?`<div class="more">+ อีก ${o.items.length-3} รายการ</div>`:'';
  const st=S.STATUS[o.status];
  const waitTxt=o.status==='doing'?` · <span class="wait">ทำมา ${ago(lastAt(o,'doing')).replace('ที่แล้ว','')}</span>`:'';
  return `<article class="order ${o.status==='verify'?'is-new':''} ${o.status==='cancel'?'is-cancel':''}">
    <div class="oh"><span class="no">${esc(o.no)}<span class="ch">${S.TYPES[o.type]} · ${clock(o.createdAt)} (${ago(o.createdAt)})${waitTxt}</span></span>
      <span class="badge ${st.cls}">${st.label}</span></div>
    <div class="ob">
      <div class="cust"><span class="av">${esc(o.name.trim().charAt(0))}</span>
        <div><b>${esc(o.name)}</b><span>${S.orderQty(o)} แก้ว · ${o.items.length} รายการ${o.source==='demo'?' · ตัวอย่าง':''}</span></div></div>
      ${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}
      <ul class="items">${items}${more}</ul>
      ${statusHint(o)}
    </div>
    <div class="of"><div class="total">ยอดชำระ (PromptPay)<b>${baht(S.orderTotal(o))}</b></div>
      <div class="acts"><button class="btn btn-ghost btn-sm" data-open="${o.no}">รายละเอียด</button>${primaryAction(o)}</div></div>
  </article>`;
}

function visible(orders){
  let list=orders.filter(o=>GROUPS[filter].includes(o.status));
  if(q){const k=q.replace(/[#\s-]/g,'').toLowerCase();
    list=orders.filter(o=>(o.no+o.name+o.phone).replace(/[#\s-]/g,'').toLowerCase().includes(k));}
  // คิวที่ต้องทำ: เก่าสุดขึ้นก่อน (มาก่อนได้ก่อน) · ที่ปิดแล้ว: ล่าสุดขึ้นก่อน
  const rank=['verify','doing','ready','coming','picked','cancel'];
  return list.sort((a,b)=>{
    const done=x=>['picked','cancel'].includes(x.status);
    if(done(a)!==done(b))return done(a)?1:-1;
    if(done(a))return lastAt(b,b.status)-lastAt(a,a.status);
    return rank.indexOf(a.status)-rank.indexOf(b.status)||a.createdAt-b.createdAt;
  });
}
function renderOrders(orders){
  const list=visible(orders);
  $('#orders').innerHTML=list.map(orderCard).join('');
  const msg=q?['🔍','ไม่พบออเดอร์ที่ค้นหา','ลองค้นด้วยเลขออเดอร์ เช่น SD-1234 หรือเบอร์โทร']
    :filter==='active'?['🎉','ไม่มีออเดอร์ค้าง','ออเดอร์ใหม่จากหน้าร้านจะเด้งเข้ามาที่นี่ — ลองกด “จำลองออเดอร์ใหม่” หรือสั่งจริงจากหน้าร้าน']
    :['📭','ยังไม่มีออเดอร์ในหมวดนี้','ลองเลือกตัวกรองอื่น'];
  $('#emptyState').innerHTML=list.length?'':`<div class="empty"><div class="e-ic">${msg[0]}</div><b>${msg[1]}</b>${msg[2]}</div>`;
}

function renderBell(orders){
  const v=orders.filter(o=>o.status==='verify').sort((a,b)=>a.createdAt-b.createdAt);
  $('#bellDot').textContent=v.length||'';
  $('#notifList').innerHTML=v.length?v.map(o=>`<button class="ni" data-open="${o.no}"><span class="ic">🧾</span>
      <div><b>${esc(o.no)} · ${esc(o.name)}</b><br><span>${baht(S.orderTotal(o))} · ${ago(o.createdAt)}</span></div></button>`).join('')
    :`<div class="empty-n">ไม่มีออเดอร์รอตรวจสลิป 👍</div>`;
}
function renderStore(){
  const on=S.getSettings().storeOpen;
  $('#storeToggle').classList.toggle('on',on);
  $('#storeLbl').textContent=on?'เปิดรับออเดอร์':'ปิดรับชั่วคราว';
}
function renderAll(){
  const orders=S.getOrders();
  renderStats(orders);renderFilters(orders);renderOrders(orders);renderBell(orders);renderStore();
  if(openNo&&$('#overlay').classList.contains('show'))renderDetail();
  Shell.refresh();
}

/* ============================================================
   STATUS TRANSITION
   ============================================================ */
const MSG={doing:'ยืนยันยอดแล้ว · เริ่มทำ',ready:'ทำเสร็จแล้ว · พร้อมรับ',coming:'บันทึกว่าโทรแจ้งแล้ว',picked:'ลูกค้ารับแล้ว · ปิดออเดอร์',cancel:'ยกเลิกออเดอร์แล้ว'};
function go(no,to,extra){
  const o=S.setStatus(no,to,extra); if(!o)return;
  mini(`${o.no} → ${MSG[to]} ✓`);
  if(to==='picked'||to==='cancel')closeModal();
  renderAll();
}

/* ============================================================
   DETAIL MODAL
   ============================================================ */
function openDetail(no){openNo=no;rejecting=false;rejectReason=REASONS[0];renderDetail();
  $('#overlay').classList.add('show');document.body.style.overflow='hidden';$('#notifPop').classList.remove('show');}
function closeModal(){openNo=null;$('#overlay').classList.remove('show');document.body.style.overflow='';
  if(/^#SD-/.test(decodeURIComponent(location.hash)))history.replaceState(null,'',location.pathname);}
function timeline(o){
  const at=s=>{const h=(o.history||[]).find(x=>x.s===s);return h?clock(h.at):'';};
  if(o.status==='cancel')return `<li class="done"><span class="pt">✓</span><div class="tx"><b>${STEPS.verify.t}</b><span>${at('verify')}</span></div></li>
    <li class="fail"><span class="pt">✕</span><div class="tx"><b>ยกเลิกออเดอร์</b><span>${esc(o.reason||'')} · ${at('cancel')}</span></div></li>`;
  const flow=flowOf(o), cur=flow.indexOf(o.status), last=flow.length-1;
  return flow.map((s,i)=>{
    const done=i<cur||(i===cur&&i===last), cls=done?'done':i===cur?'active':'pending';
    const when=i<=cur?at(s):'';
    return `<li class="${cls}"><span class="pt">${done?'✓':''}</span><div class="tx"><b>${STEPS[s].t}</b><span>${STEPS[s].s}${when?' · '+when:''}</span></div></li>`;
  }).join('');
}
function slipSection(o){
  const src=S.slipSrc(o);
  return `<div class="sec-head" style="margin:4px 0 8px"><h2 style="font-size:15px">สลิปการโอน</h2><span class="sub">${o.slip?'แนบมาจากหน้าร้าน':src?'สลิปตัวอย่าง (เดโม)':''}</span></div>
    <div class="slip-box">
      ${src?`<div class="pic" id="slipPic"><img src="${src}" alt="สลิปของ ${esc(o.name)}"></div>`:`<div class="pic none">ไม่มีรูปสลิป<br>(ลบออกเพื่อประหยัดพื้นที่)</div>`}
      <div><h4>ยอดที่ต้องได้รับ</h4><div class="amt">${baht(S.orderTotal(o))}</div>
        <ul class="chk"><li>☐ ยอดเงินตรงกับยอดสั่งซื้อ</li><li>☐ โอนเข้าบัญชี ${esc(S.getSettings().promptpay.name)}</li><li>☐ วัน–เวลาในสลิปตรงกับเวลาสั่ง (${clock(o.createdAt)})</li><li>☐ ยอดเงินเข้าแอปธนาคารแล้ว</li></ul>
        ${src?'<div style="font-size:12px;color:var(--muted);margin-top:8px">แตะรูปเพื่อขยาย</div>':''}</div>
    </div>
    ${rejecting?`<div class="reject-box"><b style="font-size:14px;color:var(--danger-ink)">เหตุผลที่สลิปไม่ผ่าน</b>
      <div class="opts">${REASONS.map(r=>`<button class="${r===rejectReason?'on':''}" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      <div style="font-size:12.5px;color:var(--danger-ink)">หลังยกเลิก ให้โทรแจ้งลูกค้า <b class="mono">${esc(o.phone)}</b> เพื่อโอนใหม่หรือคืนเงิน</div></div>`:''}`;
}
function renderDetail(){
  const o=S.getOrders().find(x=>x.no===openNo); if(!o){closeModal();return;}
  const st=S.STATUS[o.status];
  const items=o.items.map(i=>`<li><span class="th">${thumb(i)}</span><span class="q">${i.qty}×</span>
      <span class="nm">${itemName(i)}<small>${i.custom?'เมนูพิเศษ (ลูกค้ากรอกเอง)':esc(i.en)} · หวาน ${esc(i.sweet)} · ฿${i.price}/แก้ว</small></span>
      <span class="pr">฿${i.price*i.qty}</span></li>`).join('');

  let foot;
  if(o.status==='verify'){
    foot=rejecting
      ?`<button class="btn btn-ghost" data-act="unreject">ย้อนกลับ</button><button class="btn btn-danger" style="flex:1" data-act="reject">ยืนยันยกเลิกออเดอร์</button>`
      :`<button class="btn btn-danger" data-act="startReject">❌ สลิปไม่ผ่าน</button><button class="btn btn-primary" style="flex:1" data-go="${o.no}" data-to="doing">✓ ยอดถูกต้อง · เริ่มทำ</button>`;
  }else if(['picked'].includes(o.status)){
    foot=`<button class="btn btn-ghost btn-block" data-act="close">ปิด</button>`;
  }else{
    foot=primaryAction(o,true).replace('btn-sm','')||`<button class="btn btn-ghost btn-block" data-act="close">ปิด</button>`;
    foot=foot.replace(/class="btn btn-(primary|green)"/,'class="btn btn-$1" style="flex:1"');
  }

  $('#modal').innerHTML=`
    <div class="mh"><div><h3>ออเดอร์ <span class="mono">${esc(o.no)}</span></h3>
      <div style="font-size:12.5px;color:var(--muted)">${S.TYPES[o.type]} · สั่งเมื่อ ${clock(o.createdAt)} (${ago(o.createdAt)})</div></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="badge ${st.cls}">${st.label}</span>
      <button class="x" data-act="close" aria-label="ปิด">✕</button></div></div>
    <div class="mb">
      ${o.status==='verify'?slipSection(o):''}
      <div class="sec-head" style="margin:${o.status==='verify'?'20px':'4px'} 0 8px"><h2 style="font-size:15px">รายการ (${S.orderQty(o)} แก้ว)</h2></div>
      <ul class="items" style="gap:11px">${items}</ul>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:13px;border-top:1px dashed var(--border)">
        <span style="color:var(--ink-soft)">ยอดชำระ · PromptPay ${o.status==='verify'?'(รอตรวจ)':o.status==='cancel'?'(ไม่ผ่าน)':'(ยืนยันแล้ว)'}</span>
        <b style="font-family:var(--mono);font-size:21px">${baht(S.orderTotal(o))}</b></div>

      <div class="sec-head" style="margin:20px 0 8px"><h2 style="font-size:15px">ข้อมูลลูกค้า</h2><span class="sub">ไม่ต้องสมัครสมาชิก · กรอกตอนสั่ง</span></div>
      <div class="cust-block">
        <div class="row"><span class="k">ชื่อผู้สั่ง</span><span class="v">${esc(o.name)}</span></div>
        <div class="row"><span class="k">เบอร์โทร</span><span class="v tel"><a href="${callHref(o)}">${esc(o.phone)}</a></span></div>
        <div class="row"><span class="k">รูปแบบรับ</span><span class="v">${S.TYPES[o.type]}${o.type==='callback'?' — โทรแจ้งเมื่อพร้อม':' — มารับที่เคาน์เตอร์'}</span></div>
        <div class="row"><span class="k">หมายเหตุ</span><span class="v" style="color:${o.note?'var(--ink)':'var(--muted)'}">${o.note?esc(o.note):'—'}</span></div>
      </div>
      ${o.status!=='verify'&&o.status!=='cancel'&&S.slipSrc(o)?`<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-act="slip">🧾 ดูสลิปการโอน</button>`:''}

      <div class="sec-head" style="margin:20px 0 8px"><h2 style="font-size:15px">สถานะออเดอร์</h2></div>
      <ul class="timeline">${timeline(o)}</ul>
    </div>
    <div class="mf">${foot}</div>`;
}
function showSlip(o){const src=S.slipSrc(o);if(!src)return;$('#lbImg').src=src;$('#lightbox').classList.add('show');}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const op=e.target.closest('[data-open]'); if(op){openDetail(op.dataset.open);return;}
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go,g.dataset.to);return;}
  const r=e.target.closest('[data-reason]'); if(r){rejectReason=r.dataset.reason;renderDetail();return;}
  const a=e.target.closest('[data-act]');
  if(a){const o=S.getOrders().find(x=>x.no===openNo);
    ({close:closeModal,startReject:()=>{rejecting=true;renderDetail();},unreject:()=>{rejecting=false;renderDetail();},
      reject:()=>go(openNo,'cancel',{reason:rejectReason}),slip:()=>o&&showSlip(o)})[a.dataset.act]?.();return;}
  if(e.target.closest('#slipPic')){showSlip(S.getOrders().find(x=>x.no===openNo));return;}
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
$('#lightbox').addEventListener('click',()=>$('#lightbox').classList.remove('show'));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if($('#lightbox').classList.contains('show'))$('#lightbox').classList.remove('show');else closeModal();});

$('#filters').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;setFilter(b.dataset.f);});
function setFilter(f){filter=f;q='';$('#search').value='';
  history.replaceState(null,'',f==='active'?location.pathname:'#'+f);
  Shell.setActive({active:'orders',verify:'orders'}[f]||f);renderAll();}
$('#search').addEventListener('input',e=>{q=e.target.value.trim();renderOrders(S.getOrders());});

$('#simBtn').addEventListener('click',()=>{
  const o=S.simulateOrder(); Shell.announce(o);
  if(!GROUPS[filter].includes(o.status))filter='active';
  renderAll();
});
$('#storeToggleWrap').addEventListener('click',()=>{
  const s=S.getSettings(); s.storeOpen=!s.storeOpen; S.saveSettings(s);
  mini(s.storeOpen?'เปิดรับออเดอร์แล้ว — หน้าร้านสั่งได้ตามปกติ':'ปิดรับชั่วคราว — หน้าร้านจะกดชำระเงินไม่ได้');
  renderAll();
});
$('#bell').addEventListener('click',e=>{e.stopPropagation();$('#notifPop').classList.toggle('show');});
document.addEventListener('click',e=>{if(!e.target.closest('#notifPop')&&!e.target.closest('#bell'))$('#notifPop').classList.remove('show');});

/* toast ออเดอร์ใหม่ → เปิดรายละเอียดในหน้านี้เลย */
Shell.onOrderClick=o=>openDetail(o.no);
Shell.onChange(renderAll);

/* clock */
function tick(){const d=new Date();$('#clock').textContent='วันนี้ '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' · อัปเดตเรียลไทม์';}
tick();setInterval(tick,30000);

/* hash: #verify #doing #ready #done (จากเมนูข้าง) หรือ #SD-1234 (จาก toast หน้าอื่น) */
function readHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(GROUPS[h]){filter=h;Shell.setActive({verify:'orders'}[h]||h);}
  else{filter='active';Shell.setActive('orders');}
  renderAll();
  if(/^SD-/.test(h))openDetail('#'+h);
}
window.addEventListener('hashchange',readHash);
readHash();
</script>
</body>
</html>
