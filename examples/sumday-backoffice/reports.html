<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMDAY · รายงานยอดขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .range{display:flex;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:4px;box-shadow:var(--sh-sm);}
  .range button{font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:var(--r-pill);transition:all .15s;}
  .range button.on{background:var(--primary);color:#fff;}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
  @media(max-width:920px){.grid2{grid-template-columns:1fr;}}

  /* channel highlight */
  .channel{background:linear-gradient(135deg,#FFF6D6,var(--primary-soft));border:1px solid var(--border);border-radius:var(--r-lg);
    padding:20px 22px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
  .channel .ic{width:54px;height:54px;border-radius:15px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 8px 18px rgba(46,66,201,.28);}
  .channel .t b{font-family:var(--display);font-size:18px;}
  .channel .t span{display:block;font-size:13.5px;color:var(--ink-soft);}
  .channel .big{margin-left:auto;text-align:right;}
  .channel .big b{font-family:var(--mono);font-size:30px;font-weight:600;display:block;line-height:1;}
  .channel .big span{font-size:12.5px;font-weight:600;}
  .up{color:var(--ready-ink)!important;} .down{color:var(--danger-ink)!important;} .flat{color:var(--muted)!important;}
  .live-note{font-size:12.5px;color:var(--muted);margin:-8px 0 18px;}

  /* bar chart */
  .chart{display:flex;align-items:flex-end;gap:clamp(4px,1.4vw,14px);height:210px;padding-top:22px;}
  .chart.thin{gap:3px;}
  .chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
  .chart .bar{width:100%;max-width:46px;background:linear-gradient(180deg,#6F80E8,var(--primary));border-radius:8px 8px 4px 4px;
    position:relative;transition:height .6s cubic-bezier(.2,1,.3,1);min-height:3px;}
  .chart.thin .bar{border-radius:4px 4px 2px 2px;}
  .chart .col.peak .bar{background:linear-gradient(180deg,#F38B7B,var(--accent));}
  .chart .col.today .bar{background:linear-gradient(180deg,#FFDD66,var(--gold));}
  .chart .bar .v{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .chart.thin .bar .v{display:none;}
  .chart.thin .col.peak .bar .v{display:block;}
  .chart .d{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;height:16px;}
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-soft);}
  .chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}

  /* best sellers */
  .rank{display:flex;flex-direction:column;gap:6px;}
  .rank .ri{display:flex;align-items:center;gap:13px;padding:10px 8px;border-radius:var(--r);transition:background .15s;}
  .rank .ri:hover{background:var(--surface-2);}
  .rank .no{font-family:var(--display);font-weight:700;font-size:17px;width:26px;text-align:center;color:var(--muted);flex:0 0 auto;}
  .rank .ri.top1 .no{color:var(--gold);} .rank .ri.top2 .no{color:#9AA6B0;} .rank .ri.top3 .no{color:#C8855A;}
  .rank .th{width:46px;height:46px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto;overflow:hidden;font-size:20px;}
  .rank .th img{width:84%;height:84%;object-fit:contain;mix-blend-mode:multiply;}
  .rank .info{flex:1;min-width:0;}
  .rank .info b{font-size:14.5px;} .rank .info .en{font-size:12px;color:var(--muted);}
  .rank .info .meter{height:6px;background:var(--surface-2);border-radius:4px;margin-top:6px;overflow:hidden;}
  .rank .info .meter i{display:block;height:100%;background:linear-gradient(90deg,#6F80E8,var(--primary));border-radius:4px;}
  .rank .ri.top1 .info .meter i{background:linear-gradient(90deg,#F38B7B,var(--accent));}
  .rank .num{text-align:right;flex:0 0 auto;}
  .rank .num b{font-family:var(--mono);font-size:15px;} .rank .num span{display:block;font-size:11.5px;color:var(--muted);}

  /* donut */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .donut{width:150px;height:150px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;background:var(--surface-2);}
  .donut::after{content:"";position:absolute;width:92px;height:92px;border-radius:50%;background:var(--surface);}
  .donut .c{position:relative;z-index:1;text-align:center;}
  .donut .c b{font-family:var(--mono);font-size:22px;font-weight:600;display:block;line-height:1;}
  .donut .c span{font-size:11px;color:var(--muted);}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:160px;}
  .legend div{display:flex;align-items:center;gap:9px;font-size:13.5px;white-space:nowrap;}
  .legend i{width:12px;height:12px;border-radius:4px;flex:0 0 auto;}
  .legend b{font-family:var(--mono);margin-left:auto;}
  .legend small{color:var(--muted);font-family:var(--mono);font-size:11.5px;min-width:24px;text-align:right;}
  .empty.sm{padding:30px 10px;}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="tb-title">
        <h1>รายงานยอดขาย</h1>
        <div class="sub">ช่องทางออนไลน์ · เว็บสั่งซื้อ SUMDAY</div>
      </div>
      <div class="spacer"></div>
      <div class="range" id="range">
        <button data-r="1" class="on">วันนี้</button>
        <button data-r="7">7 วัน</button>
        <button data-r="30">30 วัน</button>
      </div>
    </div>

    <div class="content">
      <div id="closedBanner"></div>

      <div class="channel">
        <div class="ic">🌐</div>
        <div class="t"><b>ช่องทางออนไลน์ · เว็บสั่งซื้อ SUMDAY</b><span>ยอดจากหน้าเว็บ coffee-landing · ชำระผ่านพร้อมเพย์ + แนบสลิป</span></div>
        <div class="big"><b id="chSales">฿0</b><span id="chTrend"></span></div>
      </div>
      <div class="live-note" id="liveNote"></div>

      <div class="stats" id="kpi"></div>

      <div class="grid2">
        <div class="card-box">
          <div class="sec-head"><h2 id="chartTitle">ยอดขายรายวัน</h2><span class="sub" id="chartSub"></span></div>
          <div class="chart" id="chart"></div>
          <div class="chart-legend" id="chartLegend"></div>
        </div>

        <div class="card-box">
          <div class="sec-head"><h2>สัดส่วนหมวดเมนู</h2><span class="sub">ตามจำนวนแก้ว</span></div>
          <div class="donut-wrap">
            <div class="donut" id="donut"><div class="c"><b id="donutTotal">0</b><span>แก้ว</span></div></div>
            <div class="legend" id="legend"></div>
          </div>
        </div>
      </div>

      <div class="card-box" style="margin-top:16px">
        <div class="sec-head"><h2>เมนูขายดี 🔥</h2><span class="sub" id="rankSub">จัดอันดับตามจำนวนแก้ว</span></div>
        <div class="rank" id="rank"></div>
      </div>
    </div>
  </div>
</div>

<script src="store.js"></script>
<script src="shell.js"></script>
<script>
Shell.init('reports');
const {$,esc,baht}=Shell;
const S=SUMDAY;
const IMG='../../img/menu/';
const CAT_COLOR={coffee:'var(--blue)',milk:'var(--coral)',tea:'var(--green)',custom:'var(--gold)'};
const RANGE_LABEL={1:'วันนี้',7:'7 วันล่าสุด',30:'30 วันล่าสุด'};
const PREV_LABEL={1:'เมื่อวาน',7:'7 วันก่อนหน้า',30:'30 วันก่อนหน้า'};
let range=1;

function sum(days){
  const r={revenue:0,orders:0,cups:0,sold:{},customQty:0};
  days.forEach(d=>{r.revenue+=d.revenue;r.orders+=d.orders;r.cups+=d.cups;r.customQty+=d.customQty;
    Object.entries(d.sold).forEach(([id,q])=>r.sold[id]=(r.sold[id]||0)+q);});
  return r;
}
function trend(cur,prev){
  if(!prev)return cur?{t:'ใหม่',c:'flat'}:{t:'—',c:'flat'};
  const p=Math.round((cur-prev)/prev*100);
  return p>0?{t:`▲ ${p}%`,c:'up'}:p<0?{t:`▼ ${Math.abs(p)}%`,c:'down'}:{t:'เท่าเดิม',c:'flat'};
}

function renderKPI(cur,prev){
  const avg=x=>x.orders?Math.round(x.revenue/x.orders):0;
  const pl=PREV_LABEL[range];
  const tr=trend(cur.revenue,prev.revenue);
  $('#chSales').textContent=baht(cur.revenue);
  $('#chTrend').className=tr.c; $('#chTrend').textContent=`${tr.t} จาก${pl}`;
  const card=(ic,bg,col,lbl,val,t)=>`<div class="stat"><div class="ic" style="background:${bg};color:${col}">${ic}</div>
    <div class="lbl">${lbl}</div><div class="val">${val}</div><div class="trend ${t.c}">${t.t} <span style="color:var(--muted);font-weight:500">vs ${pl}</span></div></div>`;
  $('#kpi').innerHTML=
    card('💰','var(--primary-soft)','var(--primary-strong)',`ยอดขาย (${RANGE_LABEL[range]})`,baht(cur.revenue),tr)+
    card('🧾','var(--accent-soft)','var(--accent-strong)','จำนวนออเดอร์',cur.orders.toLocaleString(),trend(cur.orders,prev.orders))+
    card('🥤','var(--verify-soft)','var(--verify-ink)','แก้วที่ขายได้',cur.cups.toLocaleString(),trend(cur.cups,prev.cups))+
    card('📈','var(--ready-soft)','var(--ready-ink)','ยอดเฉลี่ย/บิล',baht(avg(cur)),trend(avg(cur),avg(prev)));
}

function renderChart(days){
  const chart=$('#chart');
  let cols;
  if(range===1){
    $('#chartTitle').textContent='ยอดขายรายชั่วโมง';
    $('#chartSub').textContent='วันนี้ 07–18 น. · จากออเดอร์จริง';
    const start=new Date();start.setHours(0,0,0,0);
    const list=S.getOrders().filter(o=>o.createdAt>=start.getTime()&&o.status!=='verify'&&o.status!=='cancel');
    cols=[];
    for(let h=7;h<=18;h++){
      const v=list.filter(o=>new Date(o.createdAt).getHours()===h).reduce((s,o)=>s+S.orderTotal(o),0);
      cols.push({v,d:String(h).padStart(2,'0'),label:true});
    }
    $('#chartLegend').innerHTML=`<span><i style="background:var(--primary)"></i>ยอดขายต่อชั่วโมง</span><span><i style="background:var(--accent)"></i>ชั่วโมงที่ขายดีสุด</span>`;
  }else{
    $('#chartTitle').textContent='ยอดขายรายวัน';
    $('#chartSub').textContent=RANGE_LABEL[range]+' · ช่องทางออนไลน์';
    cols=days.map((d,i)=>({v:d.revenue,today:!!d.live,
      d:range===7?d.date.toLocaleDateString('th-TH',{weekday:'short'}):(i%5===0||d.live?d.date.getDate()+'':''),label:true,
      title:d.date.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' · '+baht(d.revenue)}));
    $('#chartLegend').innerHTML=`<span><i style="background:var(--primary)"></i>ยอดขายรายวัน</span><span><i style="background:var(--accent)"></i>วันที่ขายดีสุด</span><span><i style="background:var(--gold)"></i>วันนี้ (สด)</span>`;
  }
  chart.classList.toggle('thin',range===30);
  const max=Math.max(...cols.map(c=>c.v));
  if(!max){
    chart.innerHTML=`<div class="empty sm" style="width:100%;align-self:center"><div class="e-ic">🌱</div><b>ยังไม่มียอดขายวันนี้</b>เมื่อยืนยันสลิปออเดอร์แรก ยอดจะขึ้นที่นี่</div>`;
    return;
  }
  const fmt=v=>v>=1000?'฿'+(v/1000).toFixed(1)+'k':'฿'+v;
  chart.innerHTML=cols.map(c=>`
    <div class="col ${c.v===max?'peak':''} ${c.today&&c.v!==max?'today':''}" title="${esc(c.title||c.d+':00 น. · '+baht(c.v))}">
      <div class="bar" style="height:0" data-h="${Math.max(1.5,c.v/max*100)}">${c.v?`<span class="v">${fmt(c.v)}</span>`:''}</div>
      <div class="d">${c.d}</div></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>chart.querySelectorAll('.bar').forEach(b=>b.style.height=b.dataset.h+'%')));
}

function renderDonut(cur){
  const menu=S.getMenu(), catOf=id=>(menu.find(m=>m.id===+id)||S.BASE_MENU.find(m=>m.id===+id)||{}).cat;
  const tot={}; S.CATS.forEach(c=>tot[c.k]=0);
  Object.entries(cur.sold).forEach(([id,q])=>{const c=catOf(id);if(c in tot)tot[c]+=q;});
  const rows=S.CATS.map(c=>({k:c.k,l:c.n,v:tot[c.k]}));
  if(cur.customQty)rows.push({k:'custom',l:'✨ เมนูพิเศษ',v:cur.customQty});
  const all=rows.reduce((s,r)=>s+r.v,0);
  $('#donutTotal').textContent=all.toLocaleString();
  if(!all){$('#donut').style.background='var(--surface-2)';
    $('#legend').innerHTML=`<div style="color:var(--muted)">ยังไม่มีข้อมูลในช่วงนี้</div>`;return;}
  let acc=0;const stops=rows.map(r=>{const p=r.v/all*100,s=`${CAT_COLOR[r.k]} ${acc}% ${acc+p}%`;acc+=p;return s;});
  $('#donut').style.background=`conic-gradient(${stops.join(',')})`;
  $('#legend').innerHTML=rows.map(r=>`<div><i style="background:${CAT_COLOR[r.k]}"></i>${r.l}<b>${Math.round(r.v/all*100)}%</b><small>${r.v}</small></div>`).join('');
}

function renderRank(cur){
  const menu=S.getMenu();
  const list=Object.entries(cur.sold).map(([id,q])=>{const m=menu.find(x=>x.id===+id)||S.BASE_MENU.find(x=>x.id===+id);return m?{m,q}:null;})
    .filter(Boolean).sort((a,b)=>b.q-a.q).slice(0,10);
  $('#rankSub').textContent=`${RANGE_LABEL[range]} · จัดอันดับตามจำนวนแก้ว · ราคาตามเมนูปัจจุบัน`;
  if(!list.length){$('#rank').innerHTML=`<div class="empty sm"><div class="e-ic">☕</div><b>ยังไม่มีเมนูที่ขายได้ในช่วงนี้</b>ลองเลือกช่วง 7 วัน หรือ 30 วัน</div>`;return;}
  const max=list[0].q;
  $('#rank').innerHTML=list.map(({m,q},i)=>`
    <div class="ri ${i<3?'top'+(i+1):''}">
      <span class="no">${i+1}</span>
      <span class="th">${m.img?`<img src="${IMG}${esc(m.img)}" alt="${esc(m.th)}" loading="lazy">`:'🥤'}</span>
      <div class="info"><b>${esc(m.th)}</b> <span class="en">${esc(m.en)} · ฿${m.price}</span>
        <div class="meter"><i style="width:${q/max*100}%"></i></div></div>
      <div class="num"><b>${q}</b><span>แก้ว · ${baht(q*m.price)}</span></div>
    </div>`).join('');
}

function render(){
  const all=S.salesByDay(range*2), cur=all.slice(range), prev=all.slice(0,range);
  const c=sum(cur),p=sum(prev);
  const pending=S.getOrders().filter(o=>o.status==='verify').length;
  $('#liveNote').innerHTML=`🟢 ยอด “วันนี้” คำนวณสดจากออเดอร์จริง · ไม่นับออเดอร์ที่ยกเลิก และที่ยัง<b>รอตรวจสลิป</b>${pending?` (ตอนนี้มี ${pending} ออเดอร์ — <a href="orders.html" style="color:var(--primary);font-weight:600">ไปตรวจ →</a>)`:''}`;
  renderKPI(c,p); renderChart(cur); renderDonut(c); renderRank(c);
}

$('#range').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#range button').forEach(x=>x.classList.toggle('on',x===b));
  range=+b.dataset.r; render();
});
Shell.onChange(k=>{if(k==='orders'||k==='menu'||k==='tick')render();});
render();
</script>
</body>
</html>
